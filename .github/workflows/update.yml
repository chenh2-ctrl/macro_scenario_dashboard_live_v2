name: Refresh macro data and publish dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Around minute 17 of every hour, in UTC (GitHub may run late).
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-radar-data-and-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public macro data
        id: refresh
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_data.py
      - name: Save changed observations and history to repository
        run: |
          git config user.name 'macro-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/snapshot.json data/history.json
          if ! git diff --staged --quiet; then
            git commit -m 'data: update macro indicators and verified history'
            git push origin HEAD:main
          else
            echo 'No new observations; no data commit needed.'
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare only public dashboard files
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/snapshot.json _site/data/snapshot.json
          cp data/history.json _site/data/history.json
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy latest published data
        id: deployment
        uses: actions/deploy-pages@v4
